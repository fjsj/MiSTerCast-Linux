name: Docker
on:
  push:
    branches: [main]
  pull_request:
# packages: write is used only by the push steps, which run only on main;
# GitHub offers no per-step permission scoping.
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/fjsj/mistercast-linux
jobs:
  image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # One build serves both the smoke test and the push, so the image that
      # ships is the exact image ID that passed. OCI labels come from the
      # Dockerfile, which also covers locally built images.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          load: true
          tags: mistercast-smoke
          # Named rather than left to the Dockerfile's default, so the published
          # base is visible here and a change to it is a change to this file.
          build-args: BASE=ubuntu:24.04
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: ./packaging/docker/smoke-test.sh mistercast-smoke
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image
        if: github.event_name == 'push'
        run: |
          for tag in "$IMAGE:latest" "$IMAGE:sha-${GITHUB_SHA:0:7}"; do
            docker tag mistercast-smoke "$tag"
            docker push "$tag"
          done
