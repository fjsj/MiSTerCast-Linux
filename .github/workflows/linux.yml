name: Linux
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix: {build_type: [Debug, Release]}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build qt6-base-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libpulse-dev liblz4-dev xvfb
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: xvfb-run -a ./build/mistercast check
      - if: matrix.build_type == 'Release'
        run: cpack --config build/CPackConfig.cmake -G DEB
      - if: matrix.build_type == 'Release'
        run: mkdir package-root && dpkg-deb -x MiSTerCast-*.deb package-root && test -x package-root/usr/bin/mistercast
  sanitizers:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libpulse-dev liblz4-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - run: cmake --build build && ctest --test-dir build --output-on-failure
